name: mac-dmg
on:
  workflow_dispatch:
    inputs:
      mediapipe_from_source:
        description: "Build libmediapipe.dylib with bazel from google-ai-edge/mediapipe v0.10.35 instead of the official wheel prebuilt"
        type: boolean
        default: false
  push:
    branches: [cursor/openless-gesture-host-97b3]
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "vendor/openless/src-tauri -> target" }
      - name: bazel cache
        if: ${{ inputs.mediapipe_from_source }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-mediapipe-v0.10.35-macos14-arm64
      - name: build libmediapipe.dylib from source (optional, ~60-90 min cold)
        if: ${{ inputs.mediapipe_from_source }}
        run: |
          git clone --depth 1 -b v0.10.35 https://github.com/google-ai-edge/mediapipe.git /tmp/mp
          cd /tmp/mp
          brew install bazelisk || true
          bazelisk build --config darwin_arm64 -c opt --strip always --define MEDIAPIPE_DISABLE_GPU=1 //mediapipe/tasks/c:mediapipe_macos
          mkdir -p $GITHUB_WORKSPACE/vendor/openless/src-tauri/mac-deps
          cp -f bazel-bin/mediapipe/tasks/c/libmediapipe.dylib $GITHUB_WORKSPACE/vendor/openless/src-tauri/mac-deps/
          chmod u+w $GITHUB_WORKSPACE/vendor/openless/src-tauri/mac-deps/libmediapipe.dylib
      - name: fetch mediapipe dylib + hand model (sha256-pinned)
        run: bash scripts/fetch-mac-bundle-deps.sh
      - name: npm ci
        working-directory: vendor/openless
        run: npm ci
      - name: tauri build (unsigned, ad-hoc)
        working-directory: vendor/openless
        env: { APPLE_SIGNING_IDENTITY: "-" }
        run: npx tauri build --bundles app
      - id: f
        name: finalize .app (vendor deps, @rpath id, ad-hoc sign, verify) + build dmg from signed app
        run: |
          APP=$(find vendor/openless/src-tauri/target -maxdepth 5 -path '*bundle/macos/*.app' | head -1)
          test -n "$APP"
          bash scripts/mac-finalize-app.sh "$APP" "$PWD/OpenLess-WorkDance-arm64.dmg"
          cp vendor/openless/src-tauri/mac-deps/hand_landmarker.task hand_landmarker.task
          echo "dmg=$PWD/OpenLess-WorkDance-arm64.dmg" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with: { name: openless-mac-dmg, path: "${{ steps.f.outputs.dmg }}" }
      - name: prerelease
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          T=wd-mac-${GITHUB_SHA::7}
          gh release create "$T" OpenLess-WorkDance-arm64.dmg hand_landmarker.task --prerelease --target "$GITHUB_SHA" \
            --title "WorkDance OpenLess mac $T" --notes "Unsigned arm64 build. Open: xattr -cr /Applications/OpenLess.app (or right-click > Open). Gesture: see SELFTEST.md / README-mac-dmg (MEDIAPIPE_LIB + WORKDANCE_HAND_MODEL)." \
          || gh release upload "$T" OpenLess-WorkDance-arm64.dmg hand_landmarker.task --clobber
