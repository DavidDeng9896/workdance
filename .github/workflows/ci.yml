name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  check:
    name: cargo check + ui build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (Tauri + V4L)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libv4l-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test (core + vision stub + input)
        env:
          WORKDANCE_VISION_STUB: "1"
        run: |
          cargo test -p workdance-core
          cargo test -p workdance-vision
          cargo test -p workdance-input

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: UI build (no camera)
        working-directory: apps/desktop
        run: |
          npm install
          npm run build
