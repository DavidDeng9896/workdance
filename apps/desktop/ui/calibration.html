<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkDance 校准</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="cal-page">
  <header class="cal-topbar">
    <div class="cal-brand">
      <span class="cal-brand-name">WorkDance</span>
      <span class="cal-brand-sep">校准</span>
    </div>
    <div class="cal-topbar-right">
      <span class="cal-clock" id="calClock"></span>
      <button class="btn btn-sm" id="toSettings" type="button">设置</button>
    </div>
  </header>
  <div class="cal-submeta">前置 · 镜像</div>

  <div class="cal-stage no-frame" id="calStage" aria-label="calibration stage">
    <video class="cal-feed" id="calFeed" playsinline muted autoplay></video>
    <canvas class="cal-feed cal-feed-mock" id="calMock" hidden></canvas>
    <div class="cal-vignette" aria-hidden="true"></div>
    <div class="cal-empty" id="calEmpty">打开摄像头…</div>

    <div class="corner tl active" data-corner="0"><span class="corner-plus">+</span></div>
    <div class="corner tr" data-corner="1"><span class="corner-plus">+</span></div>
    <div class="corner bl" data-corner="2"><span class="corner-plus">+</span></div>
    <div class="corner br" data-corner="3"><span class="corner-plus">+</span></div>

    <div class="fingertip" id="fingertip" aria-hidden="true"></div>
    <div class="corner-hint" id="cornerHint">用食指指向此角，再点下一步</div>

    <div class="cal-hud" id="calHud">
      <div class="row-title" id="hudTitle">四点校准 · 进度 1/4</div>
      <div class="row-desc" id="progressText">指向此角后点下一步</div>
      <div class="progress" id="progress"><span class="on"></span><span></span><span></span><span></span></div>
    </div>
  </div>

  <section class="section cal-params">
    <h2>参数</h2>
    <div class="row stack">
      <div class="row-title">灵敏度</div>
      <div class="slider-wrap">
        <input id="sensitivity" type="range" min="0" max="100" value="70" />
        <div class="slider-labels"><span>偏低更稳</span><span>偏高更跟手</span></div>
      </div>
    </div>
    <div class="row stack">
      <div class="row-title">死区</div>
      <div class="slider-wrap">
        <input id="deadZone" type="range" min="0" max="100" value="15" />
        <div class="slider-labels"><span>更小死区</span><span>更大死区</span></div>
      </div>
    </div>
  </section>

  <div class="footer">
    <button class="btn" id="nextCorner" type="button">下一步</button>
    <button class="btn btn-primary" id="confirm" type="button">确认并保存</button>
  </div>

  <script src="common.js"></script>
  <script>
    let step = 1;
    const corners = [...document.querySelectorAll(".corner")];
    const stage = document.getElementById("calStage");
    const tip = document.getElementById("fingertip");
    const hint = document.getElementById("cornerHint");
    const params = new URLSearchParams(location.search);
    const forceDemoFrame = params.get("demo") === "frame" || params.get("frame") === "1";

    function syncSliderFill(el) {
      const min = Number(el.min) || 0;
      const max = Number(el.max) || 100;
      const pct = ((Number(el.value) - min) / (max - min)) * 100;
      el.style.background = `linear-gradient(90deg, var(--accent-deep) ${pct}%, #2a3340 ${pct}%)`;
      el.style.backgroundSize = "100% 3px";
      el.style.backgroundRepeat = "no-repeat";
      el.style.backgroundPosition = "center";
    }

    function placeTipAndHint() {
      const active = corners[step - 1];
      const map = {
        tl: { tip: ["12%", "14%"], hint: { left: "56px", right: "auto", top: "22px", bottom: "auto" } },
        tr: { tip: ["88%", "14%"], hint: { left: "auto", right: "56px", top: "22px", bottom: "auto" } },
        bl: { tip: ["12%", "78%"], hint: { left: "56px", right: "auto", top: "auto", bottom: "88px" } },
        br: { tip: ["88%", "78%"], hint: { left: "auto", right: "56px", top: "auto", bottom: "88px" } },
      };
      const key = ["tl", "tr", "bl", "br"].find((k) => active.classList.contains(k)) || "tl";
      const pos = map[key];
      tip.style.left = pos.tip[0];
      tip.style.top = pos.tip[1];
      tip.classList.add("on");
      Object.assign(hint.style, pos.hint);
      hint.style.display = "block";
    }

    function paintStep() {
      corners.forEach((c, i) => c.classList.toggle("active", i === step - 1));
      document.getElementById("hudTitle").textContent = `四点校准 · 进度 ${step}/4`;
      document.getElementById("progressText").textContent = "指向此角后点下一步";
      [...document.getElementById("progress").children].forEach((el, i) => {
        el.classList.toggle("on", i < step);
      });
      placeTipAndHint();
    }

    function tickClock() {
      const el = document.getElementById("calClock");
      if (!el) return;
      const d = new Date();
      const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      el.textContent = `${days[d.getDay()]} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    }

    document.getElementById("nextCorner").onclick = () => {
      step = step >= 4 ? 1 : step + 1;
      paintStep();
    };

    document.getElementById("confirm").onclick = async () => {
      const sensitivity = Number(document.getElementById("sensitivity").value) / 100;
      const dead_zone = Number(document.getElementById("deadZone").value) / 100;
      try {
        await WD.invoke("save_calibration", {
          sensitivity,
          dead_zone,
          confirm: true,
        });
        WD.toast("校准已保存");
      } catch {
        WD.toast("当前为预览，未写入");
      }
    };

    document.getElementById("toSettings").onclick = async () => {
      try { await WD.invoke("open_named_window", { label: "settings" }); }
      catch { location.href = "settings.html"; }
    };

    const sens = document.getElementById("sensitivity");
    const dead = document.getElementById("deadZone");
    sens.addEventListener("input", () => syncSliderFill(sens));
    dead.addEventListener("input", () => syncSliderFill(dead));

    (async () => {
      try {
        const cfg = await WD.invoke("get_config");
        sens.value = Math.round(cfg.sensitivity * 100);
        dead.value = Math.round(cfg.dead_zone * 100);
      } catch {}
      syncSliderFill(sens);
      syncSliderFill(dead);
      tickClock();
      setInterval(tickClock, 30_000);
      paintStep();

      const preview = await WD.attachFrontPreview({
        video: document.getElementById("calFeed"),
        canvas: document.getElementById("calMock"),
        forceDemo: forceDemoFrame,
        drawDemo: (ctx, w, h) => WD.drawDemoHand(ctx, w, h, { tipNear: "tl" }),
      });
      stage.classList.toggle("has-frame", preview.ok);
      stage.classList.toggle("no-frame", !preview.ok);
    })();
  </script>
</body>
</html>
