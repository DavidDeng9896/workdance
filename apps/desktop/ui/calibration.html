<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkDance 校准</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
    <div>
      <h1>WorkDance · 校准</h1>
      <p class="sub">前置自拍平面四点校准骨架 · WP0 无实机预览</p>
    </div>
    <button class="btn" id="toSettings" type="button">设置</button>
  </header>

  <div class="cal-stage" aria-label="calibration stage">
    <div class="corner tl active">+</div>
    <div class="corner-hint">用食指指向此角</div>
    <div class="corner tr">+</div>
    <div class="corner bl">+</div>
    <div class="corner br">+</div>
    <div class="cal-preview">
      <div>
        <div style="font-size:15px;color:#c9d5e5;margin-bottom:6px;">摄像头预览占位</div>
        <div class="sub">黑盒 / 设备列表将在 WP1 接入内置前置</div>
        <div class="sub" id="deviceList" style="margin-top:10px;">设备：未枚举（WP0）</div>
      </div>
    </div>
  </div>

  <div class="cal-hud">
    <div class="row-title">四点校准</div>
    <div class="row-desc" id="progressText">请依次指向屏幕四角 · 进度 1/4</div>
    <div class="progress" id="progress"><span class="on"></span><span></span><span></span><span></span></div>
  </div>

  <section class="section">
    <h2>参数（仅持久化）</h2>
    <div class="row" style="flex-direction:column;align-items:stretch;">
      <div class="row-title">灵敏度</div>
      <input id="sensitivity" type="range" min="0" max="100" value="70" />
      <div class="slider-labels"><span>偏低更稳</span><span>偏高更跟手</span></div>
    </div>
    <div class="row" style="flex-direction:column;align-items:stretch;">
      <div class="row-title">死区</div>
      <input id="deadZone" type="range" min="0" max="100" value="15" />
      <div class="slider-labels"><span>更小死区</span><span>更大死区</span></div>
    </div>
  </section>

  <div class="footer">
    <button class="btn" id="nextCorner" type="button">下一步（演示）</button>
    <button class="btn btn-primary" id="confirm" type="button">确认并保存配置</button>
  </div>

  <script src="common.js"></script>
  <script>
    let step = 1;
    const corners = [...document.querySelectorAll(".corner")];

    function paintStep() {
      corners.forEach((c, i) => c.classList.toggle("active", i === step - 1));
      document.getElementById("progressText").textContent =
        `请依次指向屏幕四角 · 进度 ${step}/4`;
      [...document.getElementById("progress").children].forEach((el, i) => {
        el.classList.toggle("on", i < step);
      });
      const hint = document.querySelector(".corner-hint");
      if (hint) {
        hint.style.display = step === 1 ? "block" : "none";
      }
    }

    document.getElementById("nextCorner").onclick = () => {
      step = step >= 4 ? 1 : step + 1;
      paintStep();
    };

    document.getElementById("confirm").onclick = async () => {
      const sensitivity = Number(document.getElementById("sensitivity").value) / 100;
      const dead_zone = Number(document.getElementById("deadZone").value) / 100;
      try {
        await WD.invoke("save_calibration", {
          sensitivity,
          dead_zone,
          confirm: true,
        });
        WD.toast("校准配置已保存（占位剖面）");
      } catch {
        WD.toast("预览模式：未写入");
      }
    };

    document.getElementById("toSettings").onclick = async () => {
      try { await WD.invoke("open_named_window", { label: "settings" }); }
      catch { location.href = "settings.html"; }
    };

    (async () => {
      try {
        const cfg = await WD.invoke("get_config");
        document.getElementById("sensitivity").value = Math.round(cfg.sensitivity * 100);
        document.getElementById("deadZone").value = Math.round(cfg.dead_zone * 100);
      } catch {}
      paintStep();
    })();
  </script>
</body>
</html>
