<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>首次设置</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>首次设置</h1>
    <div class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
    <h1 style="font-size:22px;margin-top:4px;">授予必要权限</h1>
    <p class="sub">WorkDance 需要以下系统权限才能在实验台旁免触控操作。</p>
  </header>

  <div class="perm-list" id="list"></div>

  <p class="sub" id="notes" style="margin-top:14px;"></p>

  <div class="footer space-between">
    <button class="btn" id="later" type="button">稍后</button>
    <button class="btn btn-primary" id="continue" type="button">继续</button>
  </div>

  <script src="common.js"></script>
  <script>
    const icons = {
      camera: "Cam",
      microphone: "Mic",
      accessibility_or_input: "A11y",
    };
    const titles = {
      camera: "摄像头",
      microphone: "麦克风",
      accessibility_or_input: "辅助功能 (Mac) / 输入模拟 (Win)",
    };
    const descs = {
      camera: "内置前置 · 用于手势追踪",
      microphone: "中文听写 · 仅在录音时启用",
      accessibility_or_input: "控制鼠标与键盘输入（WP0 不注入）",
    };

    function statusClass(s) {
      if (s === "granted") return "status-ok";
      if (s === "missing") return "status-miss";
      return "status-unk";
    }
    function statusLabel(s) {
      if (s === "granted") return "已允许";
      if (s === "missing") return "未授权";
      return "未知";
    }

    function render(snap) {
      const list = document.getElementById("list");
      const rows = [
        ["camera", snap.camera],
        ["microphone", snap.microphone],
        ["accessibility_or_input", snap.accessibility_or_input],
      ];
      list.innerHTML = rows
        .map(([key, status]) => {
          const action =
            key === "accessibility_or_input"
              ? `<button class="btn btn-primary" data-open-os type="button">去开启</button>`
              : `<span class="${statusClass(status)}">${statusLabel(status)}</span>`;
          return `<div class="perm-item">
            <div class="perm-icon">${icons[key]}</div>
            <div class="perm-body">
              <div class="row-title">${titles[key]}</div>
              <div class="row-desc">${descs[key]}</div>
            </div>
            ${action}
          </div>`;
        })
        .join("");

      document.getElementById("notes").textContent = (snap.notes || []).join(" ");

      list.querySelectorAll("[data-open-os]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          try {
            await WD.invoke("open_os_permission_settings");
          } catch (e) {
            WD.toast(String(e.message || e));
          }
        });
      });
    }

    async function dismiss(goCalibration) {
      try { await WD.invoke("mark_first_run_done"); } catch {}
      if (goCalibration) {
        try {
          await WD.invoke("open_named_window", { label: "calibration" });
        } catch {
          location.href = "calibration.html";
          return;
        }
      }
      try {
        const { getCurrentWindow } = window.__TAURI__.window;
        await getCurrentWindow().hide();
      } catch {
        /* preview */
      }
    }

    document.getElementById("later").onclick = () => dismiss(false);
    document.getElementById("continue").onclick = () => dismiss(true);

    (async () => {
      try {
        render(await WD.invoke("get_permissions"));
      } catch {
        render({
          camera: "unknown",
          microphone: "unknown",
          accessibility_or_input: "unknown",
          platform: "preview",
          notes: ["预览模式：真实状态由桌面壳探测，不伪造已允许。"],
        });
      }
    })();
  </script>
</body>
</html>
