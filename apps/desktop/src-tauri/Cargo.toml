[package]
name = "workdance-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WorkDance WP0 desktop shell (Tauri 2 tray + settings)"

[lib]
name = "workdance_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
workdance-core = { workspace = true }
workdance-vision = { workspace = true }
workdance-input = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
parking_lot = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Forward WP-M1 MediaPipe Hands (default OFF; dlopen — compiles without native lib).
mediapipe-hands = ["workdance-vision/mediapipe-hands"]
# Forward WP-A1 sherpa ASR (default OFF; CI does not enable by default).
sherpa-asr = ["workdance-input/sherpa-asr"]
# Convenience: both real backends for Mac/Win dogfood (still needs models + native libs).
dogfood = ["mediapipe-hands", "sherpa-asr"]
