[package]
name = "workdance-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WP1 dual-tier camera + hand-presence pipeline (Rust threads)"

[features]
default = ["camera"]
# Open devices via nokhwa (v4L2 / AVFoundation / MediaFoundation).
camera = ["dep:nokhwa"]
# Optional ONNX Runtime hand-landmarker backend (requires local model file).
ort-hands = ["dep:ort", "dep:ndarray"]

[dependencies]
workdance-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
dirs = { workspace = true }
nokhwa = { version = "0.10", default-features = false, features = ["input-native"], optional = true }
ort = { version = "2.0.0-rc.10", optional = true, package = "ort" }
ndarray = { version = "0.16", optional = true }

[dev-dependencies]
tempfile = "3"
